{% extends 'online_app/base.html' %}
{% load static %}

{% block title %}Create Quiz - {{ course.title }}{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="card-custom p-4 p-md-5 bg-white">
        <h3 class="fw-bold mb-1 text-dark">Create New Quiz</h3>
        <p class="text-muted small mb-4">Course: {{ course.title }}</p>

        <form method="POST">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label small fw-semibold">Quiz Title *</label>
            {{ form.title }}
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold">Instructions / Description</label>
            {{ form.description }}
          </div>
          <div class="mb-4">
            <label class="form-label small fw-semibold">Pass Mark (%) *</label>
            {{ form.pass_mark }}
          </div>
          <div class="d-flex justify-content-between pt-3 border-top">
            <a href="{% url 'course_detail' slug=course.slug %}" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
            <button type="submit" class="btn btn-primary rounded-pill px-5 fw-bold">Next: Add Questions</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
